 if(multi(D.segs)){const sg=grp(A,2),sk=[...sg.keys()].sort((a,b)=>sg.get(b)[0]-sg.get(a)[0]);
  const sd=[{label:"Revenue",data:sk.map(i=>sg.get(i)[0]),backgroundColor:pal[1],borderRadius:4}];
  if(F.profit)sd.push({label:"Profit",data:sk.map(i=>sg.get(i)[1]),backgroundColor:pal[3],borderRadius:4});
  mk("seg",{type:"bar",data:{labels:sk.map(i=>D.segs[i]),datasets:sd},options:{...base,scales:{y:{ticks:{callback:fmt}}}}})}
 if(multi(D.prods)){const pg=[...grp(A,3)].sort((a,b)=>b[1][0]-a[1][0]).slice(0,25);
  const hd=["Product","Category","Revenue"].concat(F.profit?["Profit","Margin"]:[]).concat(F.qty?["Units"]:[]).concat(["Share"]);
  $("t").innerHTML="<tr>"+hd.map(h=>`<th>${h}</th>`).join("")+"</tr>"+(pg.length?pg.map(([i,v])=>"<tr>"+[`<td>${esc(D.prods[i])}</td>`,`<td>${esc(D.pcat[i])}</td>`,`<td>${fmt(v[0])}</td>`].concat(F.profit?[`<td>${fmt(v[1])}</td>`,`<td class="${v[0]&&v[1]/v[0]<.15?"dn":""}">${v[0]?(v[1]/v[0]*100).toFixed(1):"0.0"}%</td>`]:[]).concat(F.qty?[`<td>${v[3].toLocaleString()}</td>`]:[]).concat([`<td>${R?(v[0]/R*100).toFixed(1):"0.0"}%</td>`]).join("")+"</tr>").join(""):`<tr><td colspan="${hd.length}" class="empty">No data for this filter combination</td></tr>`)}
}
draw();matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);
</script></body></html>
